# a deliberately busy but VALID HAProxy 3.0 configuration
global
    log stdout format raw local0 info
    maxconn 50000
    nbthread 8
    cpu-map auto:1/1-8 0-7
    user haproxy
    group haproxy
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+CHACHA20
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    tune.ssl.default-dh-param 2048
    tune.bufsize 32768
    hard-stop-after 30s
    lua-load /etc/haproxy/auth.lua
    setenv ACME_URL https://acme.example
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

resolvers dns
    nameserver ns1 10.0.0.2:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

userlist admins
    group G1 users alice
    user alice insecure-password changeme

peers mypeers
    peer haproxy1 10.0.0.1:10000
    peer haproxy2 10.0.0.2:10000

cache static_cache
    total-max-size 64
    max-object-size 1000000
    max-age 60

http-errors site
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 503 /etc/haproxy/errors/503.http

defaults http_defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option forwardfor except 127.0.0.0/8
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout queue 30s
    timeout tunnel 1h
    errorfiles site
    default-server init-addr last,libc,none resolvers dns inter 3s fall 3 rise 2

frontend www
    bind :80
    bind :443 ssl crt /etc/ssl/private/site.pem alpn h2,http/1.1 ssl-min-ver TLSv1.2 tfo
    bind ipv6@:::443 v4v6 ssl crt-list /etc/haproxy/crt.lst
    maxconn 20000
    capture request header Host len 64
    capture request header User-Agent len 128
    http-request set-var(txn.host) hdr(host),lower
    http-request track-sc0 src table be_abuse
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    http-request redirect scheme https code 301 unless { ssl_fc }
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request add-header X-Request-Id %[uuid()]
    http-request set-header X-Real-IP %[src]
    http-request auth realm "admin" unless { http_auth(admins) }
    http-request replace-path ^/old/(.*) /new/\1
    http-request del-header X-Powered-By
    http-request set-log-level silent if { path_beg /health }
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response del-header Server
    http-after-response set-header X-Frame-Options DENY
    acl is_api path_beg /api /v2
    acl is_static path_end .css .js .png
    acl host_admin hdr(host) -i admin.example.com
    acl bad_ua req.hdr(user-agent) -m sub -i curl
    acl from_lan src 10.0.0.0/8 192.168.0.0/16
    tcp-request inspect-delay 5s
    tcp-request content accept if HTTP
    tcp-request connection reject if { src -f /etc/haproxy/blocklist.lst }
    use_backend api_be if is_api
    use_backend static_be if is_static
    use_backend admin_be if host_admin from_lan
    default_backend web_be

frontend tcp_in
    mode tcp
    bind :3306
    option tcplog
    default_backend mysql_be

backend web_be
    balance leastconn
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host example.com
    http-check expect status 200
    cookie SRV insert indirect nocache httponly secure
    compression algo gzip
    compression type text/html text/plain application/json
    stick-table type ip size 100k expire 30m store http_req_rate(10s)
    http-reuse safe
    server web1 10.0.1.1:8080 check cookie w1 weight 100 maxconn 500 ssl verify required ca-file /etc/ssl/ca.pem sni req.hdr(host)
    server web2 10.0.1.2:8080 check cookie w2 backup
    server-template app 1-5 app.example.com:8080 check resolvers dns init-addr none
    use-server web2 if { nbsrv(web_be) lt 2 }

backend api_be
    balance roundrobin
    hash-type consistent
    option httpchk GET /status
    http-request cache-use static_cache
    http-response cache-store static_cache
    retry-on all-retryable-errors
    http-request disable-l7-retry if METH_POST
    server api1 10.0.2.1:9000 check
    server api2 10.0.2.2:9000 check

backend static_be
    server s1 10.0.3.1:80 check

backend admin_be
    mode http
    server a1 10.0.4.1:80 check

backend mysql_be
    mode tcp
    balance source
    option mysql-check user haproxy
    server m1 10.0.5.1:3306 check

backend be_abuse
    stick-table type ip size 1m expire 10m store http_req_rate(10s),gpc0

listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:changeme
    stats admin if LOCALHOST

.if feature(OPENSSL)
frontend ssl_extra
    bind :8443 ssl crt /etc/ssl/private/x.pem
    default_backend web_be
.endif
