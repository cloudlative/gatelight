user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
load_module modules/ngx_http_geoip2_module.so;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time $request_id';
    log_format json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","ua":"$http_user_agent","host":"$host","req":"$request_uri","st":$status,"up":"$upstream_addr","country":"$geo_country"}';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    map $request_uri $is_static {
        default 0;
        ~*\.(css|js|png|jpg|svg|woff2?)$ 1;
    }
    map $http_user_agent $bad_bot {
        default 0;
        ~*(curl|wget|scrapy) 1;
    }
    geo $geo_country {
        default XX;
        10.0.0.0/8 LAN;
        192.168.0.0/16 LAN;
    }
    split_clients "${remote_addr}${http_user_agent}" $variant {
        20% "canary";
        *   "stable";
    }
    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
    limit_req_zone $http_x_api_key zone=perkey:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_perip:10m;
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static:100m max_size=10g inactive=60m use_temp_path=off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    upstream app {
        zone app_zone 64k;
        least_conn;
        server 10.0.1.10:8080 weight=3 max_fails=3 fail_timeout=15s;
        server 10.0.1.11:8080;
        server 10.0.1.12:8080 backup;
        keepalive 32;
        keepalive_timeout 60s;
    }
    upstream api {
        ip_hash;
        server api1.internal:9000 max_conns=200;
        server unix:/run/api.sock;
    }
    upstream grpc_backend { server 10.0.3.1:50051; }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ~^(?<sub>[a-z0-9-]+)\.example\.com$ example.com www.example.com;
        ssl_certificate /etc/ssl/example.pem;
        ssl_certificate_key /etc/ssl/example.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff always;
        root /var/www/$sub;
        index index.html index.htm;
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        limit_req zone=perip burst=40 nodelay;
        limit_conn conn_perip 20;
        if ($bad_bot) { return 403; }
        set $upstream_name app;
        if ($variant = canary) { set $upstream_name api; }

        location = /health { access_log off; return 200 "ok\n"; }
        location ~* \.(?:css|js|png|jpg|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
            proxy_cache static;
            proxy_cache_valid 200 301 302 10m;
            proxy_cache_use_stale error timeout updating http_500 http_502;
            proxy_pass http://app;
        }
        location /api/ {
            limit_req zone=perkey burst=200;
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_next_upstream error timeout http_502;
            location /api/admin/ {
                allow 10.0.0.0/8;
                deny all;
                proxy_pass http://api;
            }
            limit_except GET POST { deny all; }
        }
        location /ws/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location /grpc/ { grpc_pass grpc://grpc_backend; grpc_set_header X-Real-IP $remote_addr; }
        location ~ ^/legacy/(?<page>.+)$ {
            rewrite ^/legacy/(.*)$ /new/$1 permanent;
        }
        location @fallback { proxy_pass http://app; }
        location /lua {
            content_by_lua_block { ngx.say("hello") }
        }
        location / {
            try_files $uri $uri/ @fallback;
            auth_request /auth;
            auth_request_set $auth_user $upstream_http_x_user;
            proxy_set_header X-User $auth_user;
        }
        location = /auth { internal; proxy_pass http://api/auth; proxy_pass_request_body off; proxy_set_header Content-Length ""; }
    }
}

stream {
    log_format basic '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time';
    map $ssl_preread_server_name $backend {
        db.example.com db_pool;
        default web_pool;
    }
    upstream db_pool { server 10.0.5.1:5432; server 10.0.5.2:5432 backup; }
    upstream web_pool { server 10.0.6.1:443; }
    server {
        listen 5432;
        proxy_pass db_pool;
        proxy_connect_timeout 5s;
    }
    server {
        listen 8443;
        ssl_preread on;
        proxy_pass $backend;
    }
}
