name: Docker image

# Builds the image on every push and pull request, and publishes it to GitHub Container Registry
# (ghcr.io/cloudlative/gatelight) from main and from version tags (v1.2.3).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cloudlative/gatelight

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build (and push, except for pull requests)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  smoke-test:
    # The published image must start and answer its health check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: "gatelight:ci", cache-from: type=gha }
      - name: Container starts, is healthy, and prints a first-run password
        run: |
          docker run -d --name gl -e AUTH_USER=admin -e AUTH_AUTOGEN=true -e DEMO_MODE=true -p 3000:3000 gatelight:ci
          for i in $(seq 1 25); do curl -fs localhost:3000/healthz && break; sleep 1; done
          curl -fs localhost:3000/healthz
          docker logs gl 2>&1 | grep -q "FIRST RUN" || { docker logs gl; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/meta)" = "401"
