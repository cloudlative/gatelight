name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm test
      - name: Audit the bundled examples (CLI smoke test)
        run: |
          node src/cli.js audit examples/haproxy/haproxy.cfg --fail-on never
          node src/cli.js audit examples/nginx/nginx.conf --fail-on never --format github
