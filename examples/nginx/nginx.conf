user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;

events { worker_connections  4096; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream web_pool {
        least_conn;
        zone web_pool 64k;
        server 10.0.1.10:8080 weight=3 max_fails=3 fail_timeout=15s;
        server 10.0.1.11:8080 weight=1;
        server 10.0.1.12:8080 backup;
        keepalive 32;
    }

    upstream api_pool {
        server 10.0.2.20:9000;
    }

    upstream legacy_pool {          # nothing routes here any more
        server 10.0.3.30:8000;
        server 10.0.3.31:8000;
    }

    # Internal status endpoint
    server {
        listen 127.0.0.1:8081;
        server_name _;
        location /nginx_status { stub_status; allow 127.0.0.1; deny all; }
    }

    include conf.d/*.conf;
}

stream {
    upstream mqtt_pool { server 10.0.4.40:1883; server 10.0.4.41:1883; }
    server { listen 1883; proxy_pass mqtt_pool; proxy_timeout 1h; }
}
