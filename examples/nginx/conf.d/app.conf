server {
    listen 80;
    listen [::]:80;
    server_name app.example.com www.example.com;
    status_zone app_http;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name app.example.com;
    status_zone app_https;

    ssl_certificate     /etc/ssl/app.example.com.pem;
    ssl_certificate_key /etc/ssl/app.example.com.key;
    ssl_protocols TLSv1 TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://web_pool;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://api_pool/;
        proxy_set_header Authorization "Bearer s3cr3t-token-value";
    }
    location /grafana/ { proxy_pass http://10.0.5.50:3000/; }
    location /files   { alias /srv/files/; autoindex on; }
    location /ws/ { proxy_pass http://realtime_pool; }       # upstream was never defined
    location /static/ { root /var/www; expires 7d; }
}
