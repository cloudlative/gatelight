# GateLight example: a small shop behind HAProxy. Entirely synthetic (names, addresses and secrets are made up).
global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 20000
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    errorfile 503 /etc/haproxy/errors/503.http

# ---- public entry point -------------------------------------------------------------
frontend shop
    bind *:80
    bind *:443 ssl crt /etc/ssl/private/shop.pem
    http-request redirect scheme https unless { ssl_fc }

    acl is_api       path_beg /api/
    acl is_static    path_end .css .js .png .jpg .svg .woff2
    acl is_admin     path_beg /admin
    acl is_health    path /healthz
    acl is_checkout  path_beg /checkout
    acl is_legacy    path_beg /legacy
    acl admin_users  http_auth_group(shop-admins) is-admin

    http-request auth realm Admin if is_admin !admin_users
    # the API pool serves from the root, so the /api prefix is stripped before it is forwarded
    http-request replace-path ^/api/(.*) /\1 if is_api
    use_backend api_pool        if is_api
    use_backend static_pool     if is_static
    use_backend admin_pool      if is_admin
    use_backend checkout_pool   if is_checkout
    use_backend ghost_pool      if is_legacy
    # use_backend reports_pool  if { path_beg /reports }
    default_backend web_pool

# ---- internal tools ---------------------------------------------------------------------
frontend ops_metrics
    bind 127.0.0.1:9100
    default_backend metrics_pool

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:admin

# ---- backends ----------------------------------------------------------------------------
backend web_pool
    balance leastconn
    option httpchk GET /healthz
    http-check expect status 200
    cookie SRV insert indirect nocache
    server web-01 10.10.0.11:8080 check cookie web-01
    server web-02 10.10.0.12:8080 check cookie web-02
    server web-03 10.10.0.13:8080 check cookie web-03 backup

backend api_pool
    balance roundrobin
    option httpchk GET /api/health
    server api-01 10.10.1.21:9000 check inter 3s fall 3 rise 2
    server api-02 10.10.1.22:9000 check inter 3s fall 3 rise 2
    # server api-03 10.10.1.23:9000 check

backend static_pool
    balance roundrobin
    server cdn-01 10.10.2.31:8080 check
    server cdn-02 10.10.2.32:8080

backend admin_pool
    option httpchk GET /admin/ping
    server admin-01 10.10.3.41:8081 check

backend checkout_pool
    balance source
    option httpchk GET /checkout/health
    server pay-01 10.10.4.51:8443 check ssl verify none
    server pay-02 10.10.4.52:8443 check ssl verify none

backend metrics_pool
    server prom-01 127.0.0.1:9090 check

# Not referenced by any frontend (GateLight flags it as an orphan)
backend reports_pool
    server rep-01 10.10.5.61:8080 check

userlist shop-admins
    group admin users ops
    # Plaintext password: GateLight flags this. Made up for the example.
    user ops insecure-password example-only-not-real
