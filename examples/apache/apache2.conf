# GateLight example: Apache HTTP Server 2.4 reverse proxy, Debian / Ubuntu layout (/etc/apache2), sanitised.
# Addresses use private ranges and example.com names. A few weak spots are left on purpose so the
# audit, the validator and the Config Doctor have something to say.
#
#	/etc/apache2/
#	|-- apache2.conf
#	|-- ports.conf
#	|-- mods-enabled/*.load, *.conf
#	|-- conf-enabled/*.conf
#	`-- sites-enabled/*.conf

#ServerRoot "/etc/apache2"

DefaultRuntimeDir ${APACHE_RUN_DIR}
PidFile ${APACHE_PID_FILE}
Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

User ${APACHE_RUN_USER}
Group ${APACHE_RUN_GROUP}

HostnameLookups Off
ErrorLog ${APACHE_LOG_DIR}/error.log
LogLevel warn proxy:info

IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf

Include ports.conf

<Directory />
	Options FollowSymLinks
	AllowOverride None
	Require all denied
</Directory>

<Directory /usr/share>
	AllowOverride None
	Require all granted
</Directory>

# weak spot (Debian default): directory listings under /var/www
<Directory /var/www/>
	Options Indexes FollowSymLinks
	AllowOverride None
	Require all granted
</Directory>

AccessFileName .htaccess

<FilesMatch "^\.ht">
	Require all denied
</FilesMatch>

LogFormat "%v:%p %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" vhost_combined
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%h %l %u %t \"%r\" %>s %O" common
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %D" combined_timed

IncludeOptional conf-enabled/*.conf

IncludeOptional sites-enabled/*.conf
