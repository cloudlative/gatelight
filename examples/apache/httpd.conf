# GateLight example: Apache HTTP Server 2.4 reverse proxy (sanitised, RHEL-style layout).
# Addresses use private ranges and example.com names. A few weak spots are left on purpose so the
# audit, the validator and the Config Doctor have something to say.

ServerRoot "/etc/httpd"
Define LOGDIR logs

Listen 80
Listen 443 https
Listen 127.0.0.1:8081

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule http2_module modules/mod_http2.so
LoadModule status_module modules/mod_status.so
LoadModule watchdog_module modules/mod_watchdog.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule proxy_hcheck_module modules/mod_proxy_hcheck.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
LoadModule lbmethod_bybusyness_module modules/mod_lbmethod_bybusyness.so

User apache
Group apache

ServerAdmin webmaster@example.com
ServerName www.example.com:80

# weak spot: full version banner and signature
ServerTokens Full
ServerSignature On

DocumentRoot "/var/www/html"

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory "/var/www/html">
    # weak spot: directory listings
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

<Files ".ht*">
    Require all denied
</Files>

ErrorLog "${LOGDIR}/error_log"
LogLevel warn proxy:info

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%v:%p %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %D" vhost_timed
    CustomLog "${LOGDIR}/access_log" vhost_timed
</IfModule>

Timeout 60
KeepAlive On

<IfModule mpm_event_module>
    MaxRequestWorkers 400
    ThreadsPerChild 25
</IfModule>

# TLS defaults for every virtual host (weak spot: still allows TLS 1.0 / 1.1)
SSLProtocol all -SSLv3
SSLCipherSuite HIGH:!aNULL:!MD5
SSLSessionCache "shmcb:/run/httpd/sslcache(512000)"

ProxyRequests Off
ProxyTimeout 30
# ACME challenges are always answered locally, on every virtual host (inherited)
ProxyPass "/.well-known/acme-challenge/" "!"

IncludeOptional conf.d/*.conf
