# shop.example.com: HTTP -> HTTPS redirect, then the TLS virtual host

<VirtualHost *:80>
    ServerName shop.example.com
    ServerAlias www.shop.example.com
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName shop.example.com
    ServerAlias www.shop.example.com

    SSLEngine on
    SSLCertificateFile    /etc/pki/tls/certs/shop.example.com.crt
    SSLCertificateKeyFile /etc/pki/tls/private/shop.example.com.key
    Protocols h2 http/1.1

    Header always set Strict-Transport-Security "max-age=31536000"
    Header add Set-Cookie "ROUTEID=.%{BALANCER_WORKER_ROUTE}e; path=/" env=BALANCER_ROUTE_CHANGED

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # an old URL space now served by a separate application (mod_rewrite runs before ProxyPass)
    RewriteEngine On
    RewriteRule "^/old-shop/(.*)$" "http://10.0.4.40:8080/shop/$1" [P,L]

    ProxyPass        "/api/"    "balancer://api/v2/"
    ProxyPassReverse "/api/"    "balancer://api/v2/"
    ProxyPass        "/static/" "!"
    ProxyPass        "/"        "balancer://web/"
    ProxyPassReverse "/"        "balancer://web/"

    Alias "/static/" "/var/www/static/"

    # weak spots: credentials in the backend URL and in a header, and no ProxyPassReverse
    <Location "/reports/">
        ProxyPass "http://reports:s3cretpass@10.0.5.50:3000/"
        RequestHeader set Authorization "Bearer s3cr3t-token-value"
    </Location>

    <Location "/ws/">
        ProxyPass "ws://10.0.6.60:8081/ws/"
    </Location>

    ErrorLog "logs/shop_error_log"
</VirtualHost>
