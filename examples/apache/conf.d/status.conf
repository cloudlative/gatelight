# Monitoring endpoints on a loopback-only virtual host
ExtendedStatus On

<VirtualHost 127.0.0.1:8081>
    ServerName status.internal

    <Location "/server-status">
        SetHandler server-status
        Require ip 127.0.0.1 10.0.0.0/8
    </Location>

    # weak spot: balancer-manager can change members and has no access restriction
    <Location "/balancer-manager">
        SetHandler balancer-manager
    </Location>
</VirtualHost>
