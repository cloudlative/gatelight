# Load-balanced pools (mod_proxy_balancer + mod_proxy_hcheck)

<Proxy "balancer://web">
    BalancerMember "http://10.0.1.11:8080" route=web1 loadfactor=2 hcmethod=GET hcuri=/healthz hcinterval=10 hcpasses=2 hcfails=3
    BalancerMember "http://10.0.1.12:8080" route=web2 hcmethod=GET hcuri=/healthz hcinterval=10 hcpasses=2 hcfails=3
    BalancerMember "http://10.0.1.13:8080" route=web3 status=+H
    ProxySet lbmethod=bybusyness stickysession=ROUTEID
</Proxy>

# weak spot: no health checks although mod_proxy_hcheck is loaded
<Proxy "balancer://api">
    BalancerMember "http://10.0.2.21:9000" connectiontimeout=5 timeout=60
    BalancerMember "http://10.0.2.22:9000" connectiontimeout=5 timeout=60
    ProxySet lbmethod=byrequests
</Proxy>

# weak spot: a single member, and nothing routes here any more
<Proxy "balancer://legacy">
    BalancerMember "http://10.0.3.31:8080"
</Proxy>
