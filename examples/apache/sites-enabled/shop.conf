# shop.example.com: load-balanced pools, HTTP -> HTTPS redirect, then the TLS virtual host

<Proxy "balancer://web">
	BalancerMember "http://10.0.1.11:8080" route=web1 loadfactor=2 hcmethod=GET hcuri=/healthz hcinterval=10 hcpasses=2 hcfails=3
	BalancerMember "http://10.0.1.12:8080" route=web2 hcmethod=GET hcuri=/healthz hcinterval=10 hcpasses=2 hcfails=3
	BalancerMember "http://10.0.1.13:8080" route=web3 status=+H
	ProxySet lbmethod=bybusyness stickysession=ROUTEID
</Proxy>

# weak spot: no health checks although mod_proxy_hcheck is loaded
<Proxy "balancer://api">
	BalancerMember "http://10.0.2.21:9000" connectiontimeout=5 timeout=60
	BalancerMember "http://10.0.2.22:9000" connectiontimeout=5 timeout=60
	ProxySet lbmethod=byrequests
</Proxy>

# weak spot: a single member, and nothing routes here any more
<Proxy "balancer://legacy">
	BalancerMember "http://10.0.3.31:8080"
</Proxy>

<VirtualHost *:80>
	ServerName shop.example.com
	ServerAlias www.shop.example.com
	RewriteEngine On
	RewriteCond %{HTTPS} off
	RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
	ServerName shop.example.com
	ServerAlias www.shop.example.com

	SSLEngine on
	SSLCertificateFile    /etc/ssl/certs/shop.example.com.pem
	SSLCertificateKeyFile /etc/ssl/private/shop.example.com.key
	Protocols h2 http/1.1

	Header always set Strict-Transport-Security "max-age=31536000"
	Header add Set-Cookie "ROUTEID=.%{BALANCER_WORKER_ROUTE}e; path=/" env=BALANCER_ROUTE_CHANGED

	ProxyPreserveHost On
	RequestHeader set X-Forwarded-Proto "https"

	# an old URL space now served by a separate application (mod_rewrite runs before ProxyPass)
	RewriteEngine On
	RewriteRule "^/old-shop/(.*)$" "http://10.0.4.40:8080/shop/$1" [P,L]

	ProxyPass        "/api/"    "balancer://api/v2/"
	ProxyPassReverse "/api/"    "balancer://api/v2/"
	ProxyPass        "/static/" "!"
	ProxyPass        "/"        "balancer://web/"
	ProxyPassReverse "/"        "balancer://web/"

	Alias "/static/" "/var/www/static/"

	# weak spots: credentials in the backend URL and in a header, and no ProxyPassReverse
	<Location "/reports/">
		ProxyPass "http://reports:s3cretpass@10.0.5.50:3000/"
		RequestHeader set Authorization "Bearer s3cr3t-token-value"
	</Location>

	<Location "/ws/">
		ProxyPass "ws://10.0.6.60:8081/ws/"
	</Location>

	ErrorLog ${APACHE_LOG_DIR}/shop_error.log
	CustomLog ${APACHE_LOG_DIR}/shop_access.log combined_timed
</VirtualHost>
