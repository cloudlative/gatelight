# legacy.example.com: PHP-FPM through mod_proxy_fcgi, 2.2-style access control left over from an upgrade
<VirtualHost *:80>
	ServerName legacy.example.com
	DocumentRoot /var/www/legacy

	ProxyPassMatch "^/app/(.*\.php)$" "fcgi://127.0.0.1:9000/var/www/legacy/$1"
	Redirect permanent "/docs" "https://docs.example.com/"

	<Directory /var/www/legacy>
		Order allow,deny
		Allow from all
	</Directory>
</VirtualHost>
