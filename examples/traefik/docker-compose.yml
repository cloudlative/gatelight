# docker-compose.yml: the same Traefik, with containers published through docker labels (docker provider)
services:
  traefik:
    image: traefik:v3.7
    # static configuration as command-line flags (used when no traefik.yml is mounted)
    command:
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --api.dashboard=true
      - --accessLog=true
      - --accessLog.format=json
      - --certificatesResolvers.letsencrypt.acme.email=ops@example.com
      - --certificatesResolvers.letsencrypt.acme.storage=/data/acme.json
      - --certificatesResolvers.letsencrypt.acme.tlsChallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme:/data
    environment:
      - TZ=Europe/Berlin
    networks: [proxy]

  docs:
    image: nginx:1.27-alpine
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs-site.rule=Host(`docs.example.com`) && PathPrefix(`/guide`)"
      - "traefik.http.routers.docs-site.entrypoints=websecure"
      - "traefik.http.routers.docs-site.tls.certresolver=letsencrypt"
      - "traefik.http.routers.docs-site.middlewares=docs-strip"
      - "traefik.http.middlewares.docs-strip.stripprefix.prefixes=/guide"
      - "traefik.http.services.docs.loadbalancer.server.port=80"
      - "traefik.http.services.docs.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.docs.loadbalancer.healthcheck.interval=15s"

  whoami:
    image: traefik/whoami:v1.10
    networks: [proxy]
    expose:
      - "80"
    labels:
      traefik.enable: "true"
      traefik.http.routers.whoami.rule: "Host(`whoami.example.com`)"
      traefik.http.routers.whoami.entrypoints: websecure
      traefik.http.routers.whoami.tls: "true"

  grafana:
    image: grafana/grafana:11.2.0
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.example.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.middlewares=grafana-auth"
      - "traefik.http.middlewares.grafana-auth.basicauth.users=ops:$$apr1$$Zx9yWv8u$$EXAMPLEhashEXAMPLEhash1"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  internal-tool:
    image: example/internal-tool:2.3
    networks: [proxy]
    labels:
      - "traefik.http.routers.tool.rule=Host(`tool.example.com`)"

networks:
  proxy:
    external: true
