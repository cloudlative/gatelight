# app.example.com behind a two-member balancer with active health checks
ServerTokens Prod
TraceEnable Off

<Proxy "balancer://app">
    BalancerMember "http://10.10.0.11:8080" route=a1 hcmethod=GET hcuri=/health hcinterval=10
    BalancerMember "http://10.10.0.12:8080" route=a2 hcmethod=GET hcuri=/health hcinterval=10
    ProxySet lbmethod=byrequests stickysession=ROUTEID
</Proxy>

<VirtualHost *:80>
    ServerName app.example.com
    Redirect permanent "/" "https://app.example.com/"
</VirtualHost>

<VirtualHost *:443>
    ServerName app.example.com
    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/app.example.com.crt
    SSLCertificateKeyFile /etc/pki/tls/private/app.example.com.key
    Header add Set-Cookie "ROUTEID=.%{BALANCER_WORKER_ROUTE}e; path=/" env=BALANCER_ROUTE_CHANGED
    ProxyPreserveHost On
    ProxyPass        "/" "balancer://app/"
    ProxyPassReverse "/" "balancer://app/"
</VirtualHost>
